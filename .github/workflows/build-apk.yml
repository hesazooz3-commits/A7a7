name: Build A7A Cards APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Check project structure
        run: |
          echo "=== Project files ==="
          ls -la
          echo "=== App folder ==="
          ls -la app || echo "No app folder found"
          echo "=== Gradle files ==="
          ls -la *.gradle.kts || echo "No gradle files"

      - name: Grant execute permission to Gradle
        run: chmod +x gradlew || true

      - name: Build APK with wrapper
        run: ./gradlew clean :app:assembleDebug --no-daemon --stacktrace || gradle clean :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: A7A-Cards-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
